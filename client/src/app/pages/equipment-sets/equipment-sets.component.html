<div class="tab-layout">
  <aside class="tab-layout__sidebar">
    <app-job-sidebar
      [items]="savedSets"
      (addClicked)="onAdd($event)"
      (itemClicked)="onSelectExisting($event)"
    ></app-job-sidebar>
  </aside>

  <div class="tab-layout__content page">
    <h1 *ngIf="!selectedJob">Equipment Sets</h1>

    <p *ngIf="!selectedJob">Expand a job on the left and select "+ Add" to get started.</p>

    <div *ngIf="selectedJob" class="equipment-editor">
      <div class="gear-set-form">
        <h2>{{ selectedJob }} — {{ selectedSetName ? 'Edit' : 'Add' }} Gear Set</h2>

        <label class="gear-set-form__name">
          <span>Name</span>
          <input type="text" [(ngModel)]="nameInput" placeholder="Set name" />
        </label>

        <div class="gear-panel">
          <div class="gear-panel__header">
            <h3>Gear</h3>
            <button type="button" class="gear-panel__filter-link" (click)="openFilterModal()">
              Filter<span *ngIf="selectedStatFilters.size > 0"> ({{ selectedStatFilters.size }})</span>
            </button>
          </div>
          <div class="gear-panel__grid">
            <div
              class="gear-slot"
              [class.gear-slot--active]="activeSlot?.key === slot.key"
              *ngFor="let slot of gearSlots"
              (click)="onSlotClick(slot)"
              (keydown.enter)="onSlotClick(slot)"
              (keydown.space)="onSlotClick(slot)"
              role="button"
              tabindex="0"
            >
              <div class="gear-slot__header">
                <span class="gear-slot__label">{{ slot.label }}</span>
                <button
                  type="button"
                  class="gear-slot__remove"
                  *ngIf="gear[slot.key]"
                  (click)="removeGear(slot, $event)"
                  title="Remove"
                >
                  −
                </button>
              </div>
              <span class="gear-slot__value">{{ gear[slot.key] || '—' }}</span>
            </div>
          </div>
        </div>

        <div class="gear-set-form__actions">
          <button
            type="button"
            class="gear-set-form__save"
            [disabled]="!nameInput.trim()"
            (click)="save()"
          >
            Save
          </button>

          <button
            type="button"
            class="gear-set-form__delete"
            *ngIf="selectedSetName"
            (click)="delete()"
          >
            Delete
          </button>
        </div>
      </div>

      <div *ngIf="activeSlot" class="gear-picker">
        <div class="gear-picker__header">
          <h3>{{ activeSlot.label }}</h3>
          <button type="button" class="gear-picker__close" (click)="closeGearPicker()">×</button>
        </div>

        <div class="gear-picker__filters">
          <input
            type="text"
            placeholder="Search by name..."
            [(ngModel)]="searchText"
          />
          <input
            type="number"
            placeholder="Max level"
            min="1"
            [(ngModel)]="maxLevel"
          />
        </div>

        <div class="gear-picker__checkbox-row">
          <label class="gear-picker__show-details">
            <input type="checkbox" [(ngModel)]="showDetails" />
            <span>Show details</span>
          </label>

          <label class="gear-picker__show-details gear-picker__show-details--right" *ngIf="signedIn">
            <input type="checkbox" [(ngModel)]="ownedOnly" />
            <span>Owned gear</span>
          </label>
        </div>

        <div class="gear-picker__advanced" *ngIf="availableWeaponTypes().length > 0">
          <label>
            <span>Weapon Type</span>
            <select [(ngModel)]="selectedWeaponType">
              <option value="">All Types</option>
              <option *ngFor="let type of availableWeaponTypes()" [value]="type">{{ type }}</option>
            </select>
          </label>
        </div>

        <ul class="gear-picker__list">
          <li *ngFor="let item of filteredGear()">
            <button type="button" (click)="selectGear(item)">
              <div class="gear-picker__row">
                <span class="gear-picker__name">{{ item.name }}</span>
                <span class="gear-picker__level">Lv.{{ item.level }}</span>
              </div>
              <div class="gear-picker__stats" *ngIf="showDetails && item.stats">{{ item.stats }}</div>
              <div class="gear-picker__description" *ngIf="showDetails && item.weaponType && item.notes">{{ item.notes }}</div>
            </button>
          </li>
          <li *ngIf="filteredGear().length === 0" class="gear-picker__empty">
            No matching gear.
          </li>
        </ul>
      </div>
    </div>
  </div>

  <div class="modal-overlay" *ngIf="showFilterModal" (click)="closeFilterModal()">
    <div class="modal" (click)="$event.stopPropagation()">
      <div class="modal__header">
        <h3>Filter by Stats</h3>
        <button type="button" class="modal__close" (click)="closeFilterModal()">×</button>
      </div>

      <div class="modal__body">
        <div class="modal__section" *ngFor="let section of statFilterSections">
          <h4>{{ section.section }}</h4>
          <div class="modal__options">
            <label class="modal__stat-option" *ngFor="let stat of section.options">
              <input
                type="checkbox"
                [checked]="selectedStatFilters.has(stat)"
                (change)="toggleStatFilter(stat)"
              />
              <span>{{ stat }}</span>
            </label>
          </div>
        </div>
      </div>

      <div class="modal__footer">
        <button type="button" class="modal__clear" (click)="clearStatFilters()">Clear</button>
        <button type="button" class="modal__done" (click)="closeFilterModal()">Done</button>
      </div>
    </div>
  </div>
</div>
